name: release

# Tag-driven release. GitHub Actions publishes the release with its own
# GITHUB_TOKEN, so no local PAT is required. Publishing a tag is all it takes;
# the plugin store reads this repository's latest release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only: building a c-shared library needs a C
          # toolchain for the target OS, and cross-compiling darwin from Linux
          # without the SDK is not supported.
          # macos-13 (the last free x64 macOS image) has been retired, and
          # macOS 15/26 x64 runners are paid -large only, so darwin/amd64 is
          # intentionally not built. macOS users on Intel can build from source.
          - { goos: linux,  goarch: amd64, runner: ubuntu-latest }
          - { goos: linux,  goarch: arm64, runner: ubuntu-24.04-arm }
          - { goos: darwin, goarch: arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false

      - name: Resolve and verify version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*pluginVersion = "\([^"]*\)".*/\1/p' main.go | head -1)
          [ -n "$version" ] || { echo "cannot determine pluginVersion" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            expected="v${version}"
            [ "${GITHUB_REF_NAME}" = "$expected" ] || {
              echo "tag ${GITHUB_REF_NAME} does not match pluginVersion ${version} (expected ${expected})" >&2
              exit 1
            }
          fi
          echo "packaging version ${version} for ${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: Build shared library
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: sh build.sh

      # Layout required by CLIProxyAPI's installer: the dynamic library must sit
      # at the zip root, named after the plugin id, and there must be exactly one.
      - name: Package
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${{ steps.v.outputs.version }}"
          case "$GOOS" in linux) ext=so ;; darwin) ext=dylib ;; windows) ext=dll ;; esac
          zipname="models-context_${version}_${GOOS}_${GOARCH}.zip"
          mkdir -p pkg
          cp "dist/models-context-v${version}.${ext}" "pkg/models-context.${ext}"
          ( cd pkg && zip -q -X "../${zipname}" "models-context.${ext}" )
          rm -rf pkg
          echo "--- ${zipname} contents ---"
          python3 -c "import zipfile,sys; print([i.filename for i in zipfile.ZipFile(sys.argv[1]).infolist()])" "${zipname}"
          echo "$zipname" > .artifact-name

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}
          path: models-context_*.zip
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          echo "--- collected ---"
          ls -l
          count=$(ls -1 models-context_*.zip | wc -l)
          [ "$count" -ge 1 ] || { echo "no zips collected" >&2; exit 1; }
          # sha256sum format, one line per archive, as the store README requires.
          sha256sum models-context_*.zip | sort -k2 > checksums.txt
          echo "--- checksums.txt ---"
          cat checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/models-context_*.zip
            artifacts/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
