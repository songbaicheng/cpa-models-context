name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Formatting
        run: test -z "$(gofmt -l main.go main_test.go)"
      - run: go test ./...
      - run: go vet ./...
      - run: sh build.sh
      - run: python3 harness.py dist/models-context-v1.1.0.so
